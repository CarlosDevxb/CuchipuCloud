<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2332;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="20" />
  
  <!-- Grid pattern -->
  <line x1="0" y1="100" x2="600" y2="100" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3" />
  <line x1="0" y1="200" x2="600" y2="200" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3" />
  <line x1="0" y1="300" x2="600" y2="300" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3" />
  <line x1="150" y1="0" x2="150" y2="400" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3" />
  <line x1="300" y1="0" x2="300" y2="400" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3" />
  <line x1="450" y1="0" x2="450" y2="400" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3" />
  
  <!-- Person 1 - Developer -->
  <circle cx="180" cy="150" r="25" fill="#1a2332" stroke="#0066ff" stroke-width="2" />
  <circle cx="180" cy="145" r="10" fill="#334155" />
  <rect x="165" y="165" width="30" height="40" rx="5" fill="#1a2332" stroke="#0066ff" stroke-width="2" />
  
  <!-- Laptop -->
  <rect x="150" y="210" width="60" height="35" rx="3" fill="#111827" stroke="#0066ff" stroke-width="1.5" />
  <rect x="155" y="215" width="50" height="25" rx="2" fill="#0a0f1a" />
  <text x="165" y="232" font-family="monospace" font-size="8" fill="#00d4ff">&lt;code/&gt;</text>
  
  <!-- Person 2 - Designer -->
  <circle cx="300" cy="130" r="25" fill="#1a2332" stroke="#00d4ff" stroke-width="2" />
  <circle cx="300" cy="125" r="10" fill="#334155" />
  <rect x="285" y="145" width="30" height="40" rx="5" fill="#1a2332" stroke="#00d4ff" stroke-width="2" />
  
  <!-- Design tool -->
  <rect x="275" y="190" width="50" height="50" rx="5" fill="#111827" stroke="#00d4ff" stroke-width="1.5" />
  <circle cx="300" cy="210" r="12" fill="none" stroke="#0066ff" stroke-width="1.5" />
  <rect x="292" y="202" width="16" height="16" rx="2" fill="none" stroke="#00d4ff" stroke-width="1" />
  
  <!-- Person 3 - Cloud Engineer -->
  <circle cx="420" cy="150" r="25" fill="#1a2332" stroke="#10b981" stroke-width="2" />
  <circle cx="420" cy="145" r="10" fill="#334155" />
  <rect x="405" y="165" width="30" height="40" rx="5" fill="#1a2332" stroke="#10b981" stroke-width="2" />
  
  <!-- Cloud icon -->
  <ellipse cx="420" cy="220" rx="30" ry="20" fill="none" stroke="#10b981" stroke-width="1.5" />
  <ellipse cx="410" cy="215" rx="20" ry="15" fill="none" stroke="#10b981" stroke-width="1.5" />
  <ellipse cx="430" cy="215" rx="20" ry="15" fill="none" stroke="#10b981" stroke-width="1.5" />
  
  <!-- Connection lines between people -->
  <line x1="210" y1="170" x2="275" y2="170" stroke="#0066ff" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.5" />
  <line x1="330" y1="170" x2="395" y2="170" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.5" />
  
  <!-- Collaboration symbol -->
  <circle cx="300" cy="300" r="40" fill="none" stroke="url(#accentGrad)" stroke-width="2" />
  <text x="280" y="310" font-family="sans-serif" font-size="24" fill="#0066ff" font-weight="bold">1+</text>
  <text x="265" y="340" font-family="sans-serif" font-size="10" fill="#94a3b8">TRABAJO EN EQUIPO</text>
  
  <!-- Floating elements -->
  <rect x="50" y="80" width="40" height="40" rx="8" fill="#1a2332" stroke="#0066ff" stroke-width="1" opacity="0.5" transform="rotate(15 70 100)" />
  <rect x="500" y="300" width="35" height="35" rx="8" fill="#1a2332" stroke="#00d4ff" stroke-width="1" opacity="0.5" transform="rotate(-10 517 317)" />
  
  <!-- Stars/sparkles -->
  <path d="M100 300 L103 310 L113 310 L105 316 L108 326 L100 320 L92 326 L95 316 L87 310 L97 310 Z" fill="#f59e0b" opacity="0.4" />
  <path d="M500 100 L503 110 L513 110 L505 116 L508 126 L500 120 L492 126 L495 116 L487 110 L497 110 Z" fill="#00d4ff" opacity="0.4" />
</svg>