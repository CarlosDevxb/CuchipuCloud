<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.15" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="300" cy="250" r="200" fill="url(#grad1)" />
  <circle cx="300" cy="250" r="150" fill="url(#grad3)" />
  
  <!-- Cloud shape -->
  <ellipse cx="300" cy="220" rx="120" ry="80" fill="url(#grad2)" opacity="0.3" />
  <ellipse cx="260" cy="210" rx="80" ry="60" fill="url(#grad2)" opacity="0.5" />
  <ellipse cx="340" cy="210" rx="80" ry="60" fill="url(#grad2)" opacity="0.5" />
  <ellipse cx="300" cy="190" rx="100" ry="70" fill="url(#grad2)" opacity="0.4" />
  
  <!-- Server rack -->
  <rect x="240" y="260" width="120" height="160" rx="10" fill="#1a2332" stroke="#0066ff" stroke-width="2" opacity="0.8" />
  <rect x="255" y="275" width="90" height="20" rx="4" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <rect x="255" y="305" width="90" height="20" rx="4" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <rect x="255" y="335" width="90" height="20" rx="4" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <rect x="255" y="365" width="90" height="20" rx="4" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  
  <!-- LED lights -->
  <circle cx="270" cy="285" r="3" fill="#10b981" />
  <circle cx="280" cy="285" r="3" fill="#10b981" />
  <circle cx="290" cy="285" r="3" fill="#f59e0b" />
  <circle cx="270" cy="315" r="3" fill="#10b981" />
  <circle cx="280" cy="315" r="3" fill="#10b981" />
  <circle cx="290" cy="315" r="3" fill="#10b981" />
  <circle cx="270" cy="345" r="3" fill="#10b981" />
  <circle cx="280" cy="345" r="3" fill="#f59e0b" />
  <circle cx="290" cy="345" r="3" fill="#10b981" />
  <circle cx="270" cy="375" r="3" fill="#10b981" />
  <circle cx="280" cy="375" r="3" fill="#10b981" />
  <circle cx="290" cy="375" r="3" fill="#10b981" />
  
  <!-- Connection lines -->
  <line x1="300" y1="190" x2="200" y2="120" stroke="#0066ff" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" />
  <line x1="300" y1="190" x2="400" y2="120" stroke="#0066ff" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" />
  <line x1="300" y1="190" x2="300" y2="80" stroke="#00d4ff" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" />
  
  <!-- Floating nodes -->
  <circle cx="200" cy="120" r="15" fill="#1a2332" stroke="#0066ff" stroke-width="2" />
  <circle cx="200" cy="120" r="6" fill="#0066ff" />
  
  <circle cx="400" cy="120" r="15" fill="#1a2332" stroke="#00d4ff" stroke-width="2" />
  <circle cx="400" cy="120" r="6" fill="#00d4ff" />
  
  <circle cx="300" cy="80" r="15" fill="#1a2332" stroke="#0066ff" stroke-width="2" />
  <circle cx="300" cy="80" r="6" fill="#0066ff" />
  
  <!-- Data flow particles -->
  <circle cx="250" cy="155" r="3" fill="#00d4ff" opacity="0.8">
    <animate attributeName="cy" values="155;190;155" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="350" cy="155" r="3" fill="#0066ff" opacity="0.8">
    <animate attributeName="cy" values="155;190;155" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Code brackets -->
  <text x="160" y="350" font-family="monospace" font-size="40" fill="#0066ff" opacity="0.3">&lt;/&gt;</text>
  <text x="400" y="350" font-family="monospace" font-size="40" fill="#00d4ff" opacity="0.3">{}</text>
  
  <!-- Shield icon (security) -->
  <path d="M480 280 L480 320 L460 340 L440 320 L440 280 L460 260 Z" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5" />
  <path d="M460 290 L455 300 L465 300 Z" fill="#10b981" opacity="0.5" />
</svg>