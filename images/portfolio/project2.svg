<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a" />
      <stop offset="100%" style="stop-color:#111827" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="url(#bg5)" />
  
  <!-- ERP Dashboard mockup -->
  <rect x="150" y="50" width="500" height="300" rx="10" fill="#1a2332" stroke="#1e3a5f" stroke-width="2" />
  
  <!-- Title bar -->
  <rect x="150" y="50" width="500" height="35" rx="10" fill="#111827" />
  <rect x="150" y="75" width="500" height="10" fill="#111827" />
  <circle cx="175" cy="67" r="6" fill="#ef4444" />
  <circle cx="195" cy="67" r="6" fill="#f59e0b" />
  <circle cx="215" cy="67" r="6" fill="#10b981" />
  <text x="350" y="72" font-family="sans-serif" font-size="12" fill="#94a3b8">ERP System Dashboard</text>
  
  <!-- Sidebar -->
  <rect x="150" y="85" width="100" height="265" fill="#0a0f1a" />
  <rect x="160" y="100" width="80" height="20" rx="5" fill="#0066ff" opacity="0.3" />
  <rect x="160" y="130" width="80" height="20" rx="5" fill="transparent" />
  <rect x="160" y="160" width="80" height="20" rx="5" fill="transparent" />
  <rect x="160" y="190" width="80" height="20" rx="5" fill="transparent" />
  <rect x="160" y="220" width="80" height="20" rx="5" fill="transparent" />
  
  <text x="170" y="114" font-family="sans-serif" font-size="9" fill="#0066ff">Dashboard</text>
  <text x="170" y="144" font-family="sans-serif" font-size="9" fill="#94a3b8">Inventario</text>
  <text x="170" y="174" font-family="sans-serif" font-size="9" fill="#94a3b8">Ventas</text>
  <text x="170" y="204" font-family="sans-serif" font-size="9" fill="#94a3b8">Finanzas</text>
  <text x="170" y="234" font-family="sans-serif" font-size="9" fill="#94a3b8">Reportes</text>
  
  <!-- Main content area -->
  <!-- Stats cards -->
  <rect x="270" y="100" width="110" height="60" rx="6" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <text x="280" y="120" font-family="sans-serif" font-size="9" fill="#94a3b8">Ventas Hoy</text>
  <text x="280" y="145" font-family="sans-serif" font-size="18" fill="#10b981" font-weight="bold">$12,450</text>
  
  <rect x="395" y="100" width="110" height="60" rx="6" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <text x="405" y="120" font-family="sans-serif" font-size="9" fill="#94a3b8">Pedidos</text>
  <text x="405" y="145" font-family="sans-serif" font-size="18" fill="#0066ff" font-weight="bold">48</text>
  
  <rect x="520" y="100" width="110" height="60" rx="6" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <text x="530" y="120" font-family="sans-serif" font-size="9" fill="#94a3b8">Clientes</text>
  <text x="530" y="145" font-family="sans-serif" font-size="18" fill="#00d4ff" font-weight="bold">1,234</text>
  
  <!-- Chart area -->
  <rect x="270" y="175" width="360" height="120" rx="6" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <polyline points="290,270 330,250 370,260 410,230 450,240 490,210 530,220 570,190 610,200" stroke="#0066ff" stroke-width="2" fill="none" />
  <polyline points="290,270 330,260 370,265 410,245 450,255 490,235 530,240 570,220 610,230" stroke="#00d4ff" stroke-width="2" fill="none" stroke-dasharray="5,5" />
  
  <!-- Table preview -->
  <rect x="270" y="305" width="360" height="35" rx="6" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <text x="285" y="325" font-family="sans-serif" font-size="9" fill="#94a3b8">Producto</text>
  <text x="400" y="325" font-family="sans-serif" font-size="9" fill="#94a3b8">Stock</text>
  <text x="500" y="325" font-family="sans-serif" font-size="9" fill="#94a3b8">Precio</text>
  <text x="590" y="325" font-family="sans-serif" font-size="9" fill="#94a3b8">Estado</text>
