<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a" />
      <stop offset="100%" style="stop-color:#111827" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="url(#bg6)" />
  
  <!-- AWS Logo stylized -->
  <g transform="translate(400, 80)">
    <path d="M-60,0 L-40,-25 L40,-25 L60,0 L40,25 L-40,25 Z" fill="none" stroke="#ff9900" stroke-width="2.5" />
    <text x="-25" y="8" font-family="sans-serif" font-size="22" fill="#ff9900" font-weight="bold">AWS</text>
  </g>
  
  <!-- Migration arrow -->
  <rect x="150" y="150" width="150" height="80" rx="10" fill="#1a2332" stroke="#ef4444" stroke-width="2" />
  <text x="175" y="185" font-family="sans-serif" font-size="12" fill="#ef4444">On-Premise</text>
  <text x="185" y="210" font-family="sans-serif" font-size="10" fill="#94a3b8">Servidores locales</text>
  
  <line x1="320" y1="190" x2="430" y2="190" stroke="#ff9900" stroke-width="3" stroke-dasharray="8,4" />
  <polygon points="430,185 445,190 430,195" fill="#ff9900" />
  <text x="345" y="180" font-family="sans-serif" font-size="10" fill="#ff9900">Migración</text>
  
  <rect x="450" y="150" width="200" height="80" rx="10" fill="#1a2332" stroke="#10b981" stroke-width="2" />
  <text x="490" y="185" font-family="sans-serif" font-size="12" fill="#10b981">AWS Cloud</text>
  <text x="480" y="210" font-family="sans-serif" font-size="10" fill="#94a3b8">Infraestructura escalable</text>
  
  <!-- AWS Services -->
  <g transform="translate(200, 280)">
    <rect x="-40" y="-20" width="80" height="40" rx="6" fill="#111827" stroke="#ff9900" stroke-width="1.5" />
    <text x="-15" y="5" font-family="sans-serif" font-size="10" fill="#ff9900">EC2</text>
  </g>
  
  <g transform="translate(350, 280)">
    <rect x="-40" y="-20" width="80" height="40" rx="6" fill="#111827" stroke="#ff9900" stroke-width="1.5" />
    <text x="-15" y="5" font-family="sans-serif" font-size="10" fill="#ff9900">S3</text>
  </g>
  
  <g transform="translate(500, 280)">
    <rect x="-40" y="-20" width="80" height="40" rx="6" fill="#111827" stroke="#ff9900" stroke-width="1.5" />
    <text x="-15" y="5" font-family="sans-serif" font-size="10" fill="#ff9900">RDS</text>
  </g>
  
  <g transform="translate(650, 280)">
    <rect x="-40" y="-20" width="80" height="40" rx="6" fill="#111827" stroke="#ff9900" stroke-width="1.5" />
    <text x="-15" y="5" font-family="sans-serif" font-size="10" fill="#ff9900">Lambda</text>
  </g>
  
  <!-- Metrics -->
  <rect x="150" y="340" width="150" height="40" rx="6" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <text x="165" y="365" font-family="sans-serif" font-size="10" fill="#10b981">↓ 40% Costos</text>
  
  <rect x="330" y="340" width="150" height="40" rx="6" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <text x="345" y="365" font-family="sans-serif" font-size="10" fill="#0066ff">↑ 99.9% Uptime</text>
  
  <rect x="510" y="340" width="150" height="40" rx="6" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <text x="525" y="365" font-family="sans-serif" font-size="10" fill="#00d4ff">↑ 3x Velocidad</text>
</svg>