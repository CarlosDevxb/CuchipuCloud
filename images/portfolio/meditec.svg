<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="meditec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1d" />
      <stop offset="100%" style="stop-color:#0f172a" />
    </linearGradient>
    <linearGradient id="meditec-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9" />
      <stop offset="100%" style="stop-color:#10b981" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#meditec-bg)" />

  <!-- Top bar / App Header -->
  <rect x="30" y="25" width="740" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <circle cx="55" cy="50" r="14" fill="#0ea5e9" opacity="0.2" />
  <!-- Medical cross -->
  <path d="M55 42 V58 M47 50 H63" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
  <text x="80" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">MediTec-ITS</text>
  <text x="180" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">| Gestión Clínica TecNM</text>

  <!-- Status badges in header -->
  <rect x="520" y="38" width="110" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
  <circle cx="532" cy="50" r="4" fill="#10b981" />
  <text x="542" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#10b981" font-weight="600">CI/CD Docker</text>

  <rect x="640" y="38" width="115" height="24" rx="12" fill="rgba(14, 165, 233, 0.15)" stroke="#0ea5e9" stroke-width="1" />
  <text x="652" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#38bdf8" font-weight="600">SQL Direct DB</text>

  <!-- Sidebar -->
  <rect x="30" y="85" width="190" height="290" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">MÓDULOS CLÍNICOS</text>

  <!-- Nav items -->
  <rect x="40" y="125" width="170" height="34" rx="6" fill="#0ea5e9" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1" />
  <text x="68" y="146" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Expedientes Clínicos</text>
  <circle cx="53" cy="142" r="4" fill="#38bdf8" />

  <text x="68" y="180" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Control de Citas</text>
  <text x="68" y="214" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Inventario &amp; Medicinas</text>
  <text x="68" y="248" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Consultas Nutrición</text>

  <line x1="45" y1="268" x2="205" y2="268" stroke="#334155" stroke-width="1" />
  <text x="45" y="290" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">ROLES &amp; ACCESOS</text>
  <rect x="45" y="302" width="70" height="20" rx="4" fill="#0f172a" />
  <text x="52" y="315" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#94a3b8">Médicos</text>
  <rect x="120" y="302" width="85" height="20" rx="4" fill="#0f172a" />
  <text x="126" y="315" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#94a3b8">Enfermeras</text>
  <rect x="45" y="328" width="85" height="20" rx="4" fill="#0f172a" />
  <text x="52" y="341" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#94a3b8">Nutriólogas</text>

  <!-- Metric Cards -->
  <rect x="235" y="85" width="165" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="250" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Expedientes Activos</text>
  <text x="250" y="142" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#38bdf8">4,820</text>

  <rect x="415" y="85" width="165" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="430" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Citas Atendidas</text>
  <text x="430" y="142" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#10b981">1,240</text>

  <rect x="595" y="85" width="175" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="610" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Farmacia / Stock</text>
  <text x="610" y="142" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#f59e0b">99.4%</text>

  <!-- Main Patient Record View -->
  <rect x="235" y="172" width="535" height="203" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="255" y="200" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Historial Clínico Digital · Consulta Activa</text>

  <!-- Pulse waveform -->
  <path d="M490 195 L520 195 L525 185 L530 205 L535 178 L540 210 L545 192 L550 195 L580 195" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Data table row 1 -->
  <rect x="255" y="215" width="495" height="34" rx="6" fill="#0f172a" />
  <text x="270" y="236" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">No. Control: <tspan fill="#f8fafc" font-weight="600">21051284</tspan></text>
  <text x="415" y="236" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Área: <tspan fill="#38bdf8">Enfermería General</tspan></text>
  <rect x="660" y="222" width="75" height="20" rx="10" fill="rgba(16, 185, 129, 0.2)" />
  <text x="672" y="236" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#10b981" font-weight="600">Atendido</text>

  <!-- Data table row 2 -->
  <rect x="255" y="257" width="495" height="34" rx="6" fill="#0f172a" />
  <text x="270" y="278" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">No. Control: <tspan fill="#f8fafc" font-weight="600">22050912</tspan></text>
  <text x="415" y="278" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Área: <tspan fill="#a855f7">Nutrición Clínica</tspan></text>
  <rect x="660" y="264" width="75" height="20" rx="10" fill="rgba(245, 158, 11, 0.2)" />
  <text x="670" y="278" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#f59e0b" font-weight="600">En Espera</text>

  <!-- Tech tags bar -->
  <rect x="255" y="305" width="495" height="55" rx="6" fill="#141e33" stroke="#25334d" stroke-width="1" />
  <text x="270" y="325" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">STACK TECNOLÓGICO</text>
  <text x="270" y="347" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#38bdf8" font-weight="500">React · Tailwind CSS · Node.js · SQL Queries · Docker · CI/CD Pipelines</text>
</svg>
