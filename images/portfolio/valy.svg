  <text x="65" y="258" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">Cotización instantánea</text>
  <text x="65" y="274" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">Puntadas &amp; prenda</text>

  <path d="M210 252 L225 252" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  <polygon points="225,248 232,252 225,256" fill="#f59e0b" />

  <!-- Step 2 -->
  <rect x="238" y="215" width="150" height="75" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
  <text x="253" y="238" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#f59e0b">2. Taller Bordado</text>
  <text x="253" y="258" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">Cola de producción</text>
  <text x="253" y="274" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">Control de insumos</text>

  <path d="M398 252 L413 252" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  <polygon points="413,248 420,252 413,256" fill="#f59e0b" />

  <!-- Step 3 -->
  <rect x="426" y="215" width="150" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="441" y="238" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#10b981">3. Inventario 3FN</text>
  <text x="441" y="258" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">Descuento automático</text>
  <text x="441" y="274" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">Hilos, telas y piezas</text>

  <path d="M586 252 L601 252" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  <polygon points="601,248 608,252 601,256" fill="#f59e0b" />

  <!-- Step 4 -->
  <rect x="614" y="215" width="140" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="626" y="238" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#a855f7">4. CFDI 4.0</text>
  <text x="626" y="258" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">Timbrado automático</text>
  <text x="626" y="274" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">Envío por correo</text>

  <!-- Bottom Tech Bar -->
  <rect x="30" y="320" width="740" height="55" rx="10" fill="#141e33" stroke="#25334d" stroke-width="1" />
  <text x="50" y="340" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">ARQUITECTURA &amp; DESPLIEGUE</text>
  <text x="50" y="360" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#f59e0b" font-weight="500">BD Relacional en 3FN · Consultas SQL Nativas · Catálogos Dinámicos · CI/CD Cuchipu Cloud</text>
</svg>
