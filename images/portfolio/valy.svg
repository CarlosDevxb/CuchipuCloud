  <text x="45" y="142" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#38bdf8">$84,350</text>

  <rect x="215" y="85" width="175" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="230" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Taller de Bordado (Activo)</text>
  <text x="230" y="142" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#f59e0b">38 Órdenes</text>

  <rect x="405" y="85" width="175" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="420" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Catálogos Dinámicos</text>
  <text x="420" y="142" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#10b981">540 Items</text>

  <rect x="595" y="85" width="175" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="610" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Facturas Timbradas</text>
  <text x="610" y="142" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#a855f7">100% OK</text>

