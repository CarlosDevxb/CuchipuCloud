<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="valy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1120" />
      <stop offset="100%" style="stop-color:#171d2d" />
    </linearGradient>
    <linearGradient id="valy-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b" />
      <stop offset="100%" style="stop-color:#d97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#valy-bg)" />

  <!-- App Header -->
  <rect x="30" y="25" width="740" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <!-- Needle/Embroidery icon -->
  <rect x="45" y="37" width="26" height="26" rx="6" fill="#f59e0b" fill-opacity="0.2" />
  <path d="M52 57 L63 43 M63 43 L65 47 M60 41 L64 45" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <text x="80" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Valy Bordados y Uniformes Workspace</text>
  <text x="390" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">| Core ERP &amp; Facturación</text>

  <!-- Header pills -->
  <rect x="555" y="38" width="95" height="24" rx="12" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1" />
  <text x="567" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#f59e0b" font-weight="600">CFDI 4.0 SAT</text>

  <rect x="660" y="38" width="95" height="24" rx="12" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
  <text x="672" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#38bdf8" font-weight="600">DB 3FN SQL</text>

