  <rect x="610" y="210" width="60" height="8" rx="2" fill="#10b981" opacity="0.5" />
  <rect x="610" y="225" width="40" height="8" rx="2" fill="#10b981" opacity="0.3" />
  <text x="615" y="245" font-family="sans-serif" font-size="10" fill="#10b981">Secure</text>
