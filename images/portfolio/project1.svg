    <circle cx="-5" cy="40" r="8" fill="#1a2332" stroke="#0066ff" stroke-width="2" />
    <circle cx="45" cy="40" r="8" fill="#1a2332" stroke="#0066ff" stroke-width="2" />
  </g>
  
  <!-- Product cards -->
  <rect x="150" y="180" width="120" height="150" rx="10" fill="#1a2332" stroke="#1e3a5f" stroke-width="1.5" />
  <rect x="160" y="190" width="100" height="70" rx="5" fill="#111827" />
  <rect x="160" y="270" width="80" height="10" rx="3" fill="#334155" />
  <rect x="160" y="290" width="60" height="8" rx="3" fill="#1e3a5f" />
  <rect x="160" y="305" width="40" height="15" rx="5" fill="#0066ff" />
  
  <rect x="300" y="180" width="120" height="150" rx="10" fill="#1a2332" stroke="#1e3a5f" stroke-width="1.5" />
  <rect x="310" y="190" width="100" height="70" rx="5" fill="#111827" />
  <rect x="310" y="270" width="80" height="10" rx="3" fill="#334155" />
  <rect x="310" y="290" width="60" height="8" rx="3" fill="#1e3a5f" />
  <rect x="310" y="305" width="40" height="15" rx="5" fill="#0066ff" />
  
  <rect x="450" y="180" width="120" height="150" rx="10" fill="#1a2332" stroke="#1e3a5f" stroke-width="1.5" />
  <rect x="460" y="190" width="100" height="70" rx="5" fill="#111827" />
  <rect x="460" y="270" width="80" height="10" rx="3" fill="#334155" />
  <rect x="460" y="290" width="60" height="8" rx="3" fill="#1e3a5f" />
  <rect x="460" y="305" width="40" height="15" rx="5" fill="#0066ff" />
  
  <!-- Price tags -->
  <text x="210" y="320" font-family="sans-serif" font-size="10" fill="white">$99</text>
