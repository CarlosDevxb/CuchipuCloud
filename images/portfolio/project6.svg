<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a" />
      <stop offset="100%" style="stop-color:#111827" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="url(#bg9)" />
  
  <!-- Phone mockup -->
  <rect x="300" y="30" width="200" height="350" rx="25" fill="#1a2332" stroke="#1e3a5f" stroke-width="2" />
  <rect x="315" y="50" width="170" height="290" rx="5" fill="#0a0f1a" />
  
  <!-- Status bar -->
  <rect x="315" y="50" width="170" height="25" fill="#111827" />
  <text x="385" y="67" font-family="sans-serif" font-size="9" fill="#94a3b8">9:41</text>
  
  <!-- App header -->
  <rect x="315" y="75" width="170" height="40" fill="#0066ff" />
  <text x="355" y="100" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">🍕 DeliveryApp</text>
  
  <!-- Restaurant list -->
  <rect x="325" y="125" width="150" height="50" rx="8" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <circle cx="350" cy="150" r="15" fill="#1a2332" stroke="#f59e0b" stroke-width="1" />
  <text x="370" y="145" font-family="sans-serif" font-size="9" fill="white">Restaurante 1</text>
  <text x="370" y="160" font-family="sans-serif" font-size="7" fill="#94a3b8">⭐ 4.5 • 25 min</text>
  
  <rect x="325" y="185" width="150" height="50" rx="8" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <circle cx="350" cy="210" r="15" fill="#1a2332" stroke="#10b981" stroke-width="1" />
  <text x="370" y="205" font-family="sans-serif" font-size="9" fill="white">Restaurante 2</text>
  <text x="370" y="220" font-family="sans-serif" font-size="7" fill="#94a3b8">⭐ 4.8 • 15 min</text>
  
  <rect x="325" y="245" width="150" height="50" rx="8" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <circle cx="350" cy="270" r="15" fill="#1a2332" stroke="#ef4444" stroke-width="1" />
  <text x="370" y="265" font-family="sans-serif" font-size="9" fill="white">Restaurante 3</text>
  <text x="370" y="280" font-family="sans-serif" font-size="7" fill="#94a3b8">⭐ 4.2 • 30 min</text>
  
  <!-- Bottom nav -->
  <rect x="315" y="315" width="170" height="25" fill="#111827" />
  <text x="340" y="332" font-family="sans-serif" font-size="10" fill="#0066ff">🏠</text>
  <text x="380" y="332" font-family="sans-serif" font-size="10" fill="#94a3b8">🔍</text>
  <text x="420" y="332" font-family="sans-serif" font-size="10" fill="#94a3b8">🛒</text>
  <text x="460" y="332" font-family="sans-serif" font-size="10" fill="#94a3b8">👤</text>
  
  <!-- Map preview (right side) -->
  <rect x="550" y="80" width="200" height="250" rx="10" fill="#1a2332" stroke="#1e3a5f" stroke-width="1.5" />
  <text x="610" y="110" font-family="sans-serif" font-size="10" fill="#94a3b8">Tracking en vivo</text>
  
  <!-- Map grid -->
  <line x1="560" y1="130" x2="740" y2="130" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3" />
  <line x1="560" y1="160" x2="740" y2="160" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3" />
  <line x1="560" y1="190" x2="740" y2="190" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3" />
  <line x1="560" y1="220" x2="740" y2="220" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3" />
  <line x1="560" y1="250" x2="740" y2="250" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3" />
  <line x1="560" y1="280" x2="740" y2="280" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3" />
  <line x1="600" y1="120" x2="600" y2="300" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3" />
  <line x1="650" y1="120" x2="650" y2="300" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3" />
  <line x1="700" y1="120" x2="700" y2="300" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3" />
  
  <!-- Route line -->
  <path d="M620 180 L650 200 L680 190 L700 220 L680 250" stroke="#0066ff" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <!-- Delivery person marker -->
  <circle cx="620" cy="180" r="8" fill="#0066ff" />
  <text x="615" y="185" font-family="sans-serif" font-size="8" fill="white">🛵</text>
  
  <!-- Destination marker -->
  <circle cx="680" cy="250" r="8" fill="#ef4444" />
  <text x="675" y="255" font-family="sans-serif" font-size="8" fill="white">📍</text>
  
  <!-- ETA -->
  <rect x="570" y="300" width="160" height="25" rx="6" fill="#111827" />
  <text x="590" y="317" font-family="sans-serif" font-size="10" fill="#10b981">ETA: 12 min</text>
  
  <!-- Features list (left side) -->
  <g transform="translate(100, 100)">
    <rect x="-30" y="-15" width="160" height="30" rx="6" fill="#1a2332" stroke="#0066ff" stroke-width="1" />
    <text x="-15" y="5" font-family="sans-serif" font-size="10" fill="#0066ff">📍 GPS Tracking</text>
  </g>
  
  <g transform="translate(100, 160)">
    <rect x="-30" y="-15" width="160" height="30" rx="6" fill="#1a2332" stroke="#10b981" stroke-width="1" />
    <text x="-15" y="5" font-family="sans-serif" font-size="10" fill="#10b981">💳 Pagos seguros</text>
  </g>
  
  <g transform="translate(100, 220)">
    <rect x="-30" y="-15" width="160" height="30" rx="6" fill="#1a2332" stroke="#f59e0b" stroke-width="1" />
    <text x="-15" y="5" font-family="sans-serif" font-size="10" fill="#f59e0b">⭐ Reseñas reales</text>
  </g>
  
  <g transform="translate(100, 280)">
    <rect x="-30" y="-15" width="160" height="30" rx="6" fill="#1a2332" stroke="#8b5cf6" stroke-width="1" />
    <text x="-15" y="5" font-family="sans-serif" font-size="10" fill="#8b5cf6">🔔 Notificaciones</text>
  </g>
</svg>