<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a" />
      <stop offset="100%" style="stop-color:#111827" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="url(#bg8)" />
  
  <!-- Book/education icon -->
  <g transform="translate(400, 80)">
    <path d="M-40,0 L-40,-30 L0,-20 L40,-30 L40,0 L0,10 Z" fill="#1a2332" stroke="#0066ff" stroke-width="2" />
    <line x1="0" y1="-20" x2="0" y2="10" stroke="#0066ff" stroke-width="1.5" />
  </g>
  
  <!-- Video conference mockup -->
  <rect x="200" y="130" width="400" height="220" rx="10" fill="#1a2332" stroke="#1e3a5f" stroke-width="2" />
  
  <!-- Video grid -->
  <rect x="210" y="140" width="185" height="95" rx="6" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <circle cx="302" cy="175" r="15" fill="#1a2332" stroke="#0066ff" stroke-width="1.5" />
  <text x="295" y="180" font-family="sans-serif" font-size="10" fill="#0066ff">👨‍🏫</text>
  <text x="265" y="220" font-family="sans-serif" font-size="8" fill="#94a3b8">Profesor</text>
  
  <rect x="405" y="140" width="185" height="95" rx="6" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <circle cx="497" cy="175" r="15" fill="#1a2332" stroke="#00d4ff" stroke-width="1.5" />
  <text x="490" y="180" font-family="sans-serif" font-size="10" fill="#00d4ff">👨‍🎓</text>
  <text x="460" y="220" font-family="sans-serif" font-size="8" fill="#94a3b8">Estudiante 1</text>
  
  <!-- Student list -->
  <rect x="210" y="245" width="120" height="35" rx="6" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <text x="220" y="265" font-family="sans-serif" font-size="8" fill="#94a3b8">👩‍🎓 Estudiante 2</text>
  
  <rect x="340" y="245" width="120" height="35" rx="6" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <text x="350" y="265" font-family="sans-serif" font-size="8" fill="#94a3b8">👨‍🎓 Estudiante 3</text>
  
  <rect x="470" y="245" width="120" height="35" rx="6" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <text x="480" y="265" font-family="sans-serif" font-size="8" fill="#94a3b8">👩‍🎓 Estudiante 4</text>
  
  <!-- Chat/messages -->
  <rect x="210" y="290" width="380" height="30" rx="6" fill="#111827" stroke="#1e3a5f" stroke-width="1" />
  <text x="220" y="310" font-family="sans-serif" font-size="9" fill="#94a3b8">💬 ¿Alguna pregunta sobre el tema?</text>
  
  <!-- Features -->
  <g transform="translate(150, 360)">
    <circle cx="0" cy="0" r="12" fill="#0066ff" opacity="0.2" />
    <text x="-5" y="4" font-family="sans-serif" font-size="8" fill="#0066ff">📹</text>
    <text x="20" y="4" font-family="sans-serif" font-size="9" fill="#94a3b8">Video HD</text>
  </g>
  
  <g transform="translate(300, 360)">
    <circle cx="0" cy="0" r="12" fill="#10b981" opacity="0.2" />
    <text x="-5" y="4" font-family="sans-serif" font-size="8" fill="#10b981">📊</text>
    <text x="20" y="4" font-family="sans-serif" font-size="9" fill="#94a3b8">Dashboard</text>
  </g>
  
  <g transform="translate(450, 360)">
    <circle cx="0" cy="0" r="12" fill="#f59e0b" opacity="0.2" />
    <text x="-5" y="4" font-family="sans-serif" font-size="8" fill="#f59e0b">📝</text>
    <text x="20" y="4" font-family="sans-serif" font-size="9" fill="#94a3b8">Tareas</text>
  </g>
  
  <g transform="translate(600, 360)">
    <circle cx="0" cy="0" r="12" fill="#8b5cf6" opacity="0.2" />
    <text x="-5" y="4" font-family="sans-serif" font-size="8" fill="#8b5cf6">🎮</text>
    <text x="20" y="4" font-family="sans-serif" font-size="9" fill="#94a3b8">Gamificación</text>
  </g>
