<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="routix-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#090d16" />
      <stop offset="100%" style="stop-color:#131825" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#routix-bg)" />

  <!-- App Header -->
  <rect x="30" y="25" width="740" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <!-- Terminal / Server icon -->
  <rect x="45" y="37" width="26" height="26" rx="6" fill="#f97316" fill-opacity="0.2" />
  <path d="M51 46 L57 50 L51 54 M60 55 H65" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="80" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Routix</text>
  <text x="145" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">| ITAM &amp; ITSM Laboratorio Redes y Hardware</text>

  <!-- Status badges -->
  <rect x="525" y="38" width="110" height="24" rx="12" fill="rgba(249, 115, 22, 0.15)" stroke="#f97316" stroke-width="1" />
  <text x="537" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fb923c" font-weight="600">Rust + Axum API</text>

  <rect x="645" y="38" width="110" height="24" rx="12" fill="rgba(78, 170, 240, 0.15)" stroke="#38bdf8" stroke-width="1" />
  <text x="657" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#38bdf8" font-weight="600">SolidJS UI</text>

  <!-- Sidebar: Labs & Modules -->
  <rect x="30" y="85" width="200" height="290" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">GESTIÓN DE LABS</text>

  <rect x="40" y="125" width="180" height="34" rx="6" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="1" />
  <text x="68" y="146" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#fb923c">Inventario Hardware (ITAM)</text>
  <circle cx="53" cy="142" r="4" fill="#fb923c" />

  <text x="68" y="180" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Tickets de Soporte (ITSM)</text>
  <text x="68" y="214" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Stock de Refacciones</text>
  <text x="68" y="248" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Bitácoras de Incidentes</text>
  <text x="68" y="282" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Horarios &amp; Asignación Docente</text>

  <!-- Performance badge -->
  <rect x="42" y="315" width="176" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="52" y="333" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">PostgreSQL Raw Queries</text>
  <text x="52" y="349" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#10b981">⚡ Latencia API &lt; 2ms</text>

  <!-- Center-Right: Rack / Nodes Topology + Hardware Inventory -->
  <rect x="245" y="85" width="525" height="135" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="265" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">MAPA DE LABORATORIO: RACKS, ESTACIONES &amp; HARDWARE</text>

  <!-- Node 1: Router Core -->
  <rect x="265" y="128" width="115" height="75" rx="8" fill="#0f172a" stroke="#f97316" stroke-width="1.5" />
  <text x="278" y="152" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fb923c">Cisco 2901 (R1)</text>
  <text x="278" y="170" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">IP: 192.168.10.1</text>
  <rect x="278" y="178" width="50" height="15" rx="3" fill="rgba(16, 185, 129, 0.2)" />
  <text x="283" y="189" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#10b981">Operativo</text>

  <!-- Connection line -->
  <line x1="380" y1="165" x2="400" y2="165" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" />

  <!-- Node 2: Switch Core -->
  <rect x="400" y="128" width="115" height="75" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="413" y="152" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Switch 24p Giga</text>
  <text x="413" y="170" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">VLAN 10, 20, 30</text>
  <rect x="413" y="178" width="50" height="15" rx="3" fill="rgba(16, 185, 129, 0.2)" />
  <text x="418" y="189" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#10b981">24/24 UP</text>

  <!-- Connection line -->
  <line x1="515" y1="165" x2="535" y2="165" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" />

  <!-- Node 3: PCs Lab -->
  <rect x="535" y="128" width="115" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="548" y="152" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Estaciones (32)</text>
  <text x="548" y="170" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">RAM/SSD auditados</text>
  <rect x="548" y="178" width="55" height="15" rx="3" fill="rgba(56, 189, 248, 0.2)" />
  <text x="553" y="189" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#38bdf8">Auditado</text>

  <!-- Node 4: Rack Refacciones -->
  <rect x="660" y="128" width="95" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="670" y="152" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Refacciones</text>
  <text x="670" y="170" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">Cables, NICs</text>
  <rect x="670" y="178" width="40" height="15" rx="3" fill="rgba(245, 158, 11, 0.2)" />
  <text x="675" y="189" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#f59e0b">Stock</text>

  <!-- Tickets & Incident Log Table -->
  <rect x="245" y="230" width="525" height="145" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="265" y="255" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">BITÁCORA DE INCIDENTES &amp; TICKETS DE DOCENTES</text>

  <rect x="260" y="268" width="495" height="34" rx="6" fill="#0f172a" />
  <text x="275" y="289" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#f8fafc"><tspan fill="#f97316" font-weight="700">#TK-104</tspan> · Falla cable UTP Patch Cord Lab 3</text>
  <text x="560" y="289" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">Docente: Ing. M. Garza</text>
  <rect x="680" y="275" width="65" height="20" rx="10" fill="rgba(16, 185, 129, 0.2)" />
  <text x="692" y="289" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#10b981" font-weight="600">Resuelto</text>

  <rect x="260" y="308" width="495" height="34" rx="6" fill="#0f172a" />
  <text x="275" y="329" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#f8fafc"><tspan fill="#38bdf8" font-weight="700">#TK-105</tspan> · Reasignación de puerto switch rack 2</text>
  <text x="560" y="329" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">Docente: Dr. R. Silva</text>
  <rect x="680" y="315" width="65" height="20" rx="10" fill="rgba(249, 115, 22, 0.2)" />
  <text x="692" y="329" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#fb923c" font-weight="600">En Curso</text>
</svg>
