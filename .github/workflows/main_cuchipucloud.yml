name: Deploy Cuchipu Cloud (Nginx self-hosted)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Directorio raíz que sirve Nginx (ajustar si es distinto)
  WEB_ROOT: /var/www/cuchipu-web

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sincronizar archivos al directorio web
        run: |
          rsync -av --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'README.md' \
            ./ "$WEB_ROOT/"

      - name: Validar y recargar Nginx
        run: |
          sudo nginx -t
          sudo systemctl reload nginx

      - name: Verificar sitio
        run: curl -fsS -o /dev/null -w "HTTP %{http_code}\n" http://localhost/
