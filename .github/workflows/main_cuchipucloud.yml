name: Deploy Cuchipu Cloud

on:
  push:
    branches: [ "main" ]

jobs:
  despliegue-web:
    runs-on: self-hosted

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' 

    - name: Instalar dependencias
      run: npm install

    - name: Compilar el proyecto
      run: npm run build

    - name: Sincronizar archivos con Nginx
      # Usamos rsync en lugar de cp porque --delete elimina archivos viejos que ya no existen
      run: |
        rsync -av --delete dist/ /var/www/cuchipu-web/
